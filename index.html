    <script>
      ;(function () {
        const prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
        const setting = localStorage.getItem('vueuse-color-scheme') || 'auto'
        if (setting === 'dark' || (prefersDark && setting !== 'light'))
          document.documentElement.classList.toggle('dark', true)

        const savedLang = localStorage.getItem('tuquet-lang')
        const browserLangs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']
        const detectedLang = browserLangs.some(l => String(l).toLowerCase().startsWith('vi')) ? 'vi' : 'en'
        const resolvedLang = (savedLang === 'vi' || savedLang === 'en') ? savedLang : detectedLang
        document.documentElement.dataset.lang = resolvedLang
        document.documentElement.lang = resolvedLang
      })()
    </script>
